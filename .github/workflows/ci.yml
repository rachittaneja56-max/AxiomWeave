name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AXIOMWEAVE_TEST_POSTGRES_URL: postgresql+psycopg://axiom:axiom@127.0.0.1:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install and verify FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run pyright
        working-directory: backend
      - name: Verify PostgreSQL integration URL
        run: test -n "$AXIOMWEAVE_TEST_POSTGRES_URL"
      - name: Run PostgreSQL integration tests
        run: uv run pytest tests/test_postgres_migrations.py
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - name: Generate deterministic Phase 5 human-review bundle
        run: uv run python -m scripts.create_phase5_bundle --output-dir .phase5-human-review
        working-directory: backend
      - name: Upload Phase 5 human-review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-media-review-${{ github.sha }}
          path: backend/.phase5-human-review/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
